<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Zotero Color Keys">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6666"/>
      <stop offset="0.25" stop-color="#ffcb00"/>
      <stop offset="0.5" stop-color="#5fb236"/>
      <stop offset="0.75" stop-color="#2ea8e5"/>
      <stop offset="1" stop-color="#a28ae5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="1040" cy="40" r="120" fill="#2ea8e5" opacity="0.18" filter="url(#soft)"/>
  <circle cx="120" cy="320" r="140" fill="#ff6666" opacity="0.14" filter="url(#soft)"/>

  <rect x="64" y="64" width="72" height="72" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="100" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">A</text>
  <rect x="80" y="122" width="12" height="6" rx="2" fill="#ff6666"/>
  <rect x="94" y="122" width="12" height="6" rx="2" fill="#ffcb00"/>
  <rect x="108" y="122" width="12" height="6" rx="2" fill="#2ea8e5"/>

  <text x="160" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">Zotero Color Keys</text>
  <text x="160" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94a3b8">Keyboard-first text color &amp; highlight color for Zotero notes</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">
    <g>
      <rect x="64" y="216" width="112" height="52" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="120" y="250" text-anchor="middle" fill="#e2e8f0">Alt+R</text>
      <rect x="188" y="232" width="20" height="20" rx="5" fill="#ff2020"/>
    </g>
    <g>
      <rect x="236" y="216" width="112" height="52" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="292" y="250" text-anchor="middle" fill="#e2e8f0">Alt+Y</text>
      <rect x="360" y="232" width="20" height="20" rx="5" fill="#ffcb00"/>
    </g>
    <g>
      <rect x="408" y="216" width="186" height="52" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="501" y="250" text-anchor="middle" fill="#e2e8f0">Ctrl+Alt+Y</text>
      <rect x="606" y="232" width="20" height="20" rx="5" fill="#ffd400" opacity="0.85"/>
    </g>
    <g>
      <rect x="654" y="216" width="186" height="52" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="747" y="250" text-anchor="middle" fill="#e2e8f0">Ctrl+Alt+D</text>
      <rect x="852" y="232" width="20" height="20" rx="5" fill="#94a3b8" opacity="0.6"/>
    </g>
    <g>
      <rect x="900" y="216" width="164" height="52" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <text x="982" y="250" text-anchor="middle" fill="#e2e8f0">Selection first</text>
    </g>
  </g>

  <rect x="64" y="300" width="1072" height="4" rx="2" fill="url(#accent)" opacity="0.9"/>
</svg>
